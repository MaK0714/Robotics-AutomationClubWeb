<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robotics & Automation Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;700&family=Roboto+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
      <style>
        body {
          margin: 0;
          padding: 0;
          background-color: #000;
        }
        .initial-loader-wrapper {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #000;
          z-index: 9999;
        }
        .initial-loader-gear {
          width: 160px;
          height: 160px;
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .gear-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          animation: gear-spin 10s linear infinite;
          filter: drop-shadow(0 0 30px rgba(14, 165, 233, 0.25));
        }
        @keyframes gear-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        .gear-text {
          position: relative;
          z-index: 10;
          color: #38bdf8;
          font-family: 'Roboto Mono', monospace;
          font-weight: 900;
          font-size: 42px;
          letter-spacing: 0.05em;
        }
        /* Hardcoded to dark/black theme for loader to match user request */
        .gear-path { fill: #0f1117; stroke: #38bdf8; }
        .gear-track { stroke: rgba(14, 165, 233, 0.5); }
        .gear-core { fill: #0a0c12; stroke: #0284c7; }
      </style>
  </head>
  <body class="bg-slate-100 dark:bg-black text-slate-900 dark:text-slate-100 antialiased selection:bg-cyan-500 selection:text-black font-sans transition-colors duration-200">
    <div id="root">
      <div class="initial-loader-wrapper">
        <div class="initial-loader-gear">
          <svg viewBox="-100 -100 200 200" class="gear-svg">
            <path class="gear-path" stroke-width="2.5" stroke-linejoin="round" fill="#0f1117" stroke="#38bdf8" d="M 77.85 4.90 L 93.76 15.28 L 91.11 26.91 L 72.26 29.36 L 68.01 38.19 L 77.85 54.45 L 70.41 63.78 L 52.37 57.81 L 44.71 63.92 L 46.51 82.83 L 35.76 88.01 L 22.10 74.80 L 12.55 76.98 L 5.97 94.81 L -5.97 94.81 L -12.55 76.98 L -22.10 74.80 L -35.76 88.01 L -46.51 82.83 L -44.71 63.92 L -52.37 57.81 L -70.41 63.78 L -77.85 54.45 L -68.01 38.19 L -72.26 29.36 L -91.11 26.91 L -93.76 15.28 L -77.85 4.90 L -77.85 -4.90 L -93.76 -15.28 L -91.11 -26.91 L -72.26 -29.36 L -68.01 -38.19 L -77.85 -54.45 L -70.41 -63.78 L -52.37 -57.81 L -44.71 -63.92 L -46.51 -82.83 L -35.76 -88.01 L -22.10 -74.80 L -12.55 -76.98 L -5.97 -94.81 L 5.97 -94.81 L 12.55 -76.98 L 22.10 -74.80 L 35.76 -88.01 L 46.51 -82.83 L 44.71 -63.92 L 52.37 -57.81 L 70.41 -63.78 L 77.85 -54.45 L 68.01 -38.19 L 72.26 -29.36 L 91.11 -26.91 L 93.76 -15.28 L 77.85 -4.90 Z" />
            <circle class="gear-track" cx="0" cy="0" r="68" fill="none" stroke="rgba(14, 165, 233, 0.5)" stroke-width="1.5" stroke-dasharray="4 3" />
            <circle class="gear-core" cx="0" cy="0" r="58" fill="#0a0c12" stroke="#0284c7" stroke-width="1.5" />
          </svg>
          <div class="gear-text">RAC</div>
        </div>
      </div>
    </div>
    <script>
      // Temporary error catcher for debugging
      window.addEventListener('error', (event) => {
        const errorText = document.createElement('div');
        errorText.style = 'position:fixed;top:0;left:0;z-index:999999;background:rgba(255,0,0,0.9);color:white;padding:20px;font-family:monospace;max-width:100%;word-wrap:break-word;';
        errorText.textContent = 'Resource/React Error: ' + (event.error ? event.error.stack : (event.message || (event.target && event.target.src ? 'Failed to load: ' + event.target.src : 'Unknown error')));
        document.body.appendChild(errorText);
      }, true);
      window.addEventListener('unhandledrejection', (event) => {
        const errorText = document.createElement('div');
        errorText.style = 'position:fixed;top:0;left:0;z-index:999999;background:rgba(255,0,0,0.9);color:white;padding:20px;font-family:monospace;max-width:100%;word-wrap:break-word;';
        errorText.textContent = 'Promise Error: ' + (event.reason ? event.reason.stack || event.reason : 'Unknown');
        document.body.appendChild(errorText);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
